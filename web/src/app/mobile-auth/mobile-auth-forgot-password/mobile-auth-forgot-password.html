<section class="auth-screen" aria-labelledby="auth-forgot-title">
  <p class="auth-kicker">{{ headerTitle }}</p>
  <h1 id="auth-forgot-title" tabindex="-1">Forgot password</h1>
  <p class="auth-lede">Enter your account email. We never confirm whether an account exists.</p>

  <div class="auth-status" role="status" aria-live="polite">
    @if (errorMessage()) {
      <p class="auth-error" id="auth-forgot-error">{{ errorMessage() }}</p>
    }
    @if (successMessage()) {
      <p class="auth-success">{{ successMessage() }}</p>
    }
  </div>

  @if (!successMessage()) {
    <form (submit)="submit($event)" novalidate>
      <div class="field">
        <label for="auth-forgot-email">Email</label>
        <input
          id="auth-forgot-email"
          name="email"
          type="email"
          autocomplete="username"
          required
          [value]="email()"
          (input)="email.set(inputValue($event))"
          [attr.aria-invalid]="errorMessage() ? true : null"
          [attr.aria-describedby]="errorMessage() ? 'auth-forgot-error' : null"
        />
      </div>

      <button type="submit" class="primary" [disabled]="submitting()">
        {{ submitting() ? 'Submitting…' : 'Submit' }}
      </button>
    </form>
  }

  <div class="auth-links">
    <a routerLink="/mobile/auth/sign-in">Back to sign in</a>
  </div>
</section>
