<section class="auth-screen" aria-labelledby="auth-sign-in-title">
  <img class="auth-logo" src="/first-response-logo.png" [attr.alt]="headerTitle" width="128" height="128" />
  <h1 id="auth-sign-in-title" tabindex="-1">Sign in</h1>
  <p class="auth-lede">Authorized users only</p>

  <div class="auth-status" role="status" aria-live="polite">
    @if (errorMessage()) {
      <p class="auth-error" id="auth-sign-in-error">{{ errorMessage() }}</p>
    }
  </div>

  <form (submit)="submit($event)" novalidate>
    <div class="field">
      <label for="auth-sign-in-email">Email</label>
      <input
        id="auth-sign-in-email"
        name="email"
        type="email"
        autocomplete="username"
        required
        [value]="email()"
        (input)="email.set(inputValue($event))"
        [attr.aria-invalid]="errorMessage() ? true : null"
        [attr.aria-describedby]="errorMessage() ? 'auth-sign-in-error' : null"
      />
    </div>

    <div class="field">
      <label for="auth-sign-in-password">Password</label>
      <div class="password-row">
        <input
          id="auth-sign-in-password"
          name="password"
          [type]="passwordFieldType()"
          autocomplete="current-password"
          required
          [value]="password()"
          (input)="password.set(inputValue($event))"
          [attr.aria-invalid]="errorMessage() ? true : null"
          [attr.aria-describedby]="errorMessage() ? 'auth-sign-in-error' : null"
        />
        <button
          type="button"
          class="visibility-toggle"
          (click)="togglePasswordVisibility()"
          [attr.aria-pressed]="passwordVisible()"
        >
          {{ passwordVisible() ? 'Hide password' : 'Show password' }}
        </button>
      </div>
    </div>

    <button type="submit" class="primary" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <div class="auth-links">
    <a routerLink="/mobile/auth/forgot-password">Forgot password?</a>
    <a routerLink="/mobile/auth/first-time-access">First-time access</a>
  </div>
</section>
