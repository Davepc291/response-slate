<section class="auth-screen" aria-labelledby="admin-denied-title">
  <p class="auth-kicker">{{ headerTitle }}</p>
  <h1 id="admin-denied-title" tabindex="-1">Access denied</h1>
  <p class="auth-lede">
    You do not have permission to view administrator screens. If you believe this is incorrect,
    contact your system administrator.
  </p>

  <div class="auth-links">
    <a routerLink="/mobile/auth/sessions">Back to your account</a>
    <a routerLink="/mobile/auth/sign-in">Sign in as a different user</a>
  </div>
</section>
