<section class="auth-screen" aria-labelledby="auth-unavailable-title">
  <p class="auth-kicker">{{ headerTitle }}</p>
  <h1 id="auth-unavailable-title" tabindex="-1">Sign-in unavailable</h1>
  <p class="auth-error" role="status">Sign-in is temporarily unavailable. NOT LIVE CAD.</p>
  <p class="auth-lede">No account or credential details are shown. You can try again.</p>
  <button type="button" class="primary" (click)="retry()">Try again</button>
</section>
